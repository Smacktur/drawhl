<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tiko</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="description" content="Open-source infinite canvas for your tasks: live cards from your tracker, arranged the way you think" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="tiko" />
    <meta property="og:description" content="Open-source infinite canvas for your tasks: live cards from your tracker, arranged the way you think" />
    <meta name="twitter:card" content="summary" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "tiko",
        "description": "Open-source infinite canvas for your tasks: live cards from your tracker, arranged the way you think",
        "applicationCategory": "WebApplication",
        "inLanguage": "en"
      }
    </script>
    <script>
      // Applies the saved theme before first paint; keep in sync with src/lib/theme.ts.
      try {
        var t = localStorage.getItem('tiko.theme')
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
    <!--head-->
  </head>
  <body>
    <div id="root"><!--app--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
