name: installer-windows
# Runs only when the Windows installer changes. install.ps1 is linted, not run: hosted Windows
# runners have no WSL 2 for Docker Desktop.
on:
  pull_request:
    paths:
      - install/install.ps1
      - .github/workflows/installer-windows.yml

permissions:
  contents: read

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: PSScriptAnalyzer
        shell: powershell
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path install/install.ps1 -Severity Warning, Error -ExcludeRule PSAvoidUsingWriteHost
          $issues | Format-Table -AutoSize
          if ($issues) { exit 1 }
