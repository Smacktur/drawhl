# Build the user guide in docs/guide on every change; publish it to GitHub Pages from main.
name: docs
on:
  push:
    branches: [main]
    paths: ["docs/guide/**", "install/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/guide/**", "install/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/guide
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/guide/package-lock.json
      - run: npm ci
      # The installers are served next to the guide, so the published ones are always main's.
      - run: cp ../../install/install.sh ../../install/install.ps1 public/
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/guide/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
