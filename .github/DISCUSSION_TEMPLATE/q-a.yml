body:
  - type: markdown
    attributes:
      value: Hide real task names and tokens in screenshots and logs before you post them. If something is broken, open a bug report in Issues instead.
  - type: textarea
    id: question
    attributes:
      label: What are you trying to do?
      description: The goal, not only the step that fails.
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What have you tried, and what happened?
  - type: input
    id: version
    attributes:
      label: tiko version
      description: The About panel shows it.
  - type: dropdown
    id: install
    attributes:
      label: How you run tiko
      options:
        - Installer (install.sh or install.ps1)
        - Docker Compose from source
        - Railway
        - Render
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: What `docker compose logs api` prints around the problem.
      render: text
