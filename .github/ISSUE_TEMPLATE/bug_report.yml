name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove tokens, internal hostnames and real task names from logs and screenshots before you post them.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did and what you saw. A screenshot or a short recording helps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Does it happen every time?
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The About panel shows it. A release tag or a commit SHA also works.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you run tiko
      options:
        - Installer (install.sh or install.ps1)
        - Docker Compose from source
        - Railway
        - Render
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and OS
      description: For example, Chrome 141 on macOS 15.
  - type: input
    id: tracker
    attributes:
      label: Tracker
      description: Demo tasks or Jira Data Center with its version, if the bug involves cards.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `docker compose logs api` around the problem, and errors from the browser console if the page misbehaves.
      render: text
